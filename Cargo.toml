[package]
name = "ice-portal-api-prometheus-exporter"
version = "0.1.0"
edition = "2021"

[dependencies]
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
tokio = { version = "1.44.2", features = ["full"] }
reqwest = { version = "0.12.15", features = ["json", "rustls-tls"], default-features=false }
anyhow = "1.0.98"
futures-util = "0.3.31"
serde = "1.0.219"
serde_derive = "1.0.219"
serde_json = "1.0.140"
metrics-exporter-prometheus = "0.17.0"
metrics = "0.24.2"
metrics-util = "0.19.1"
